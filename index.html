<style>

*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:'Malgun Gothic','맑은 고딕',Arial,sans-serif;color:var(--ink);}
header{background:linear-gradient(135deg,#0f172a,#1d4ed8);color:white;padding:18px 24px;box-shadow:0 4px 18px rgba(15,23,42,.18)}

.candidate-list{display:flex;flex-direction:column;gap:8px;max-height:calc(100vh - 260px);overflow:auto;padding-right:4px}
.candidate-card{border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;background:#fff;transition:.15s}

.badge.blue{background:var(--blue2);color:#1e40af;border-color:#bfdbfe}
.kpi-grid{display:grid;grid-template-columns:repeat(5,minmax(120px,1fr));gap:10px;margin-bottom:16px}

.kpi .label{font-size:12px;color:var(--muted)} .kpi .value{font-size:24px;font-weight:900;margin-top:4px}
.section{margin-top:18px;border-top:1px solid var(--line);padding-top:16px}
.section h2{font-size:18px;margin:0 0 10px;letter-spacing:-.5px}
.section h3{font-size:15px;margin:12px 0 8px}
.detail-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;background:#f8fafc;border:1px solid var(--line);border-radius:16px;padding:14px}
.detail-head h2{margin:0;font-size:20px}
.detail-head .sub{font-size:13px;color:var(--muted);margin-top:4px}
.score-ring{width:112px;height:112px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--green) calc(var(--score)*1%),#e5e7eb 0);position:relative;flex:0 0 auto}
.score-ring::before{content:'';position:absolute;width:78px;height:78px;border-radius:50%;background:#fff}
.score-ring b{position:relative;font-size:26px} .score-ring span{position:relative;font-size:11px;color:var(--muted);display:block;text-align:center}
.gate-grid{display:grid;grid-template-columns:repeat(5,minmax(130px,1fr));gap:10px}
.gate{border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff}
.gate .gate-title{font-weight:900;font-size:14px;margin-bottom:6px}
.gate .gate-state{font-size:18px;font-weight:900;margin-bottom:5px}
.gate.pass{border-color:#86efac;background:#f0fdf4} .gate.cond{border-color:#fde68a;background:#fffbeb} .gate.fail{border-color:#fecaca;background:#fef2f2}
.gate p{margin:0;font-size:12px;color:#475569;line-height:1.45}
table{border-collapse:collapse;width:100%;font-size:13px;background:#fff}
th,td{border:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
th{background:#eaf2ff;font-weight:900;color:#1e3a8a;position:sticky;top:0;z-index:1}
.numeric{text-align:right;font-variant-numeric:tabular-nums}
input,select,textarea{font-family:inherit;border:1px solid var(--line);border-radius:8px;padding:7px;background:#fff;width:100%}
input[type=number]{text-align:right}
.form-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.form-item label{font-size:12px;font-weight:800;color:#475569;display:block;margin-bottom:5px}
.score-bars{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.bar-card{border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff}
.bar-top{display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:900}
.bar{height:12px;background:#e5e7eb;border-radius:999px;margin-top:8px;overflow:hidden}
.bar>i{display:block;height:100%;background:#2563eb;border-radius:999px;width:0}
.formula{font-family:Consolas,'Courier New',monospace;background:#0f172a;color:#e2e8f0;border-radius:12px;padding:12px;font-size:12px;line-height:1.6;overflow:auto}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{background:#f1f5f9;border:1px solid var(--line)} .tab.active{background:#2563eb;color:white}
.tab-panel{display:none} .tab-panel.active{display:block}
.mapbox{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.mapbox img{display:block;width:100%;height:auto}
.note{background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;padding:10px;color:#9a3412;font-size:13px;line-height:1.5}
.footer-note{font-size:12px;color:#64748b;margin-top:12px;line-height:1.55}
@media(max-width:1100px){.container{grid-template-columns:1fr}.sidebar{min-height:auto}.kpi-grid{grid-template-columns:repeat(2,1fr)}.gate-grid,.score-bars,.form-grid{grid-template-columns:1fr}}
@media print{header,.sidebar,.toolbar,.tabs{display:none} .container{display:block;padding:0} .main{border:0;box-shadow:none} .tab-panel{display:block!important;page-break-inside:avoid} body{background:white}}

.area-panel{background:#f8fafc;border:1px solid var(--line);border-radius:14px;margin-bottom:12px;padding:11px}
.area-panel h3{margin:0 0 8px;font-size:14px}
.area-stat{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:12px}
.area-stat span{background:white;border:1px solid #e5e7eb;border-radius:8px;padding:6px;text-align:center}
.mapwrap{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(310px,.75fr);gap:14px;align-items:start}
.mapbox{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;padding:10px}
.detailmap{border:1px solid var(--line);border-radius:14px;padding:12px;background:#f8fafc}
.parcel:hover,.parcel.active{stroke:#111827!important;stroke-width:4!important;fill-opacity:.8!important}
.rank-label.active circle{fill:#f59e0b!important;stroke:#111827!important;stroke-width:3!important;r:19}
.score100{color:#047857;font-weight:900}
.origscore{color:#64748b;font-size:12px;margin-left:4px}
.hidden{display:none!important}
.kakao-map{width:100%;height:560px;border:1px solid var(--line);border-radius:10px;background:#e5e7eb}
.km-marker{display:flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;color:white;font-size:12px;font-weight:800;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.35);cursor:pointer;border:2px solid white;transform:translate(-50%,-50%)}
.km-marker.active{outline:3px solid #111827;z-index:30}
.km-shaft{background:#111827;color:white;font-weight:800;font-size:12px;padding:3px 8px;border-radius:7px;border:2px solid #dc2626;transform:translate(-50%,-130%);white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.km-extra{width:16px;height:16px;border-radius:50%;border:3px solid white;transform:translate(-50%,-50%);box-shadow:0 1px 6px rgba(0,0,0,.65);pointer-events:auto}
.kakao-banner{margin:0 0 8px;padding:10px 12px;background:#fef3c7;color:#92400e;font-size:13px;border-radius:10px}
.kakao-banner code{background:rgba(0,0,0,.06);padding:1px 5px;border-radius:5px}

.layer-control{margin:8px 0 10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#ffffff;box-shadow:0 1px 4px rgba(15,23,42,.06)}
.layer-control .lc-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.layer-control .lc-title{font-size:13px;font-weight:900;color:#1f2937}
.layer-control .lc-actions{display:flex;gap:5px;flex-wrap:wrap}
.layer-control .lc-actions button{font-size:11px;padding:4px 7px;border-radius:7px;background:#e2e8f0;box-shadow:none}
.layer-control .lc-grid{display:flex;gap:6px;flex-wrap:wrap}
.layer-control label{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;border:1px solid #dbe3ef;border-radius:999px;padding:5px 8px;background:#f8fafc;cursor:pointer;user-select:none}
.layer-control input{width:auto;margin:0}
.layer-control .lc-dot{width:10px;height:10px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.20)}




.reason-box{border:1px solid #fed7aa;background:#fff7ed;color:#7c2d12;border-radius:14px;padding:12px;margin-top:12px;line-height:1.55}
.reason-box h3{margin:0 0 8px;font-size:15px;color:#9a3412}
.reason-list{display:grid;grid-template-columns:1fr;gap:7px;margin:0;padding:0;list-style:none}
.reason-list li{background:#fff;border:1px solid #ffedd5;border-radius:10px;padding:8px 10px;font-size:13px}
.reason-list b{display:inline-block;min-width:92px;color:#111827}
.tag-wrap{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag{display:inline-flex;align-items:center;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:900;border:1px solid #cbd5e1;background:#f8fafc;color:#334155}
.tag.good{background:#dcfce7;color:#166534;border-color:#86efac}.tag.warn{background:#ffedd5;color:#9a3412;border-color:#fed7aa}.tag.bad{background:#fee2e2;color:#991b1b;border-color:#fecaca}.tag.blue{background:#dbeafe;color:#1e40af;border-color:#bfdbfe}.tag.gray{background:#f1f5f9;color:#475569;border-color:#cbd5e1}

.checklist-toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0 14px}

.check-mini{border:1px solid var(--line);border-radius:12px;background:#f8fafc;padding:9px;text-align:center}

.check-section{margin:14px 0 18px;border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden}

<body>
<header>
  <h1>한강로·길동 수직구 후보지 현장확인 체크리스트 앱</h1>
  <p>GIS 1차 평가 결과와 현장 확인사항을 연계한 후보지 병렬검토 화면 · 후보지별 현장 체크리스트 작성 및 CSV 저장</p>
  <div class="toolbar">
    <button class="ghost" onclick="window.print()">인쇄 / PDF 저장</button>
    <button class="ghost" onclick="exportCSV()">현재 후보표 CSV 저장</button>
    <button class="ghost" onclick="exportChecklistCSV('filtered')">현장체크 CSV 저장</button>
    <button class="ghost" onclick="resetFilters()">필터 초기화</button>
    <button class="warn" onclick="alert('후보지를 클릭하면 상세정보, 위치도, 현장 체크리스트가 연동됩니다. 체크리스트는 브라우저에 자동 저장되며 CSV로 내려받을 수 있습니다.')">사용법</button>
  </div>
</header>
<div class="container">
  <aside class="sidebar">
    <h2 style="font-size:16px;margin:0 0 8px">후보지 목록</h2>
    <input class="search" id="search" placeholder="후보지·수직구·PNU·지목 검색" oninput="renderList()" />
    <div class="filter-row">
      <button onclick="setArea('전체')">전체</button>
      <button onclick="setArea('한강로')">한강로</button>
      <button onclick="setArea('길동')">길동</button>
      <button onclick="setTopOnly()">상위만</button>
      <button onclick="setShowAllCandidates()">전체후보</button>
      <button onclick="setPassOnly()">Pass</button>
    </div>
    <div class="layer-control candidate-control">
      <div class="lc-head">
        <div class="lc-title">후보 표시 ON·OFF <span style="font-weight:600;color:#2563eb">(초기 상위후보만)</span></div>
        <div class="lc-actions">
          <button type="button" onclick="setCandidateVisibility(true,false)">상위만</button>
          <button type="button" onclick="setCandidateVisibility(true,true)">전체보기</button>
          <button type="button" onclick="setCandidateVisibility(false,false)">후보끄기</button>
        </div>
      </div>
      <div class="lc-grid">
        <label title="상위 후보 레이어 표시"><input id="showTopCandidates" type="checkbox" autocomplete="off" checked onchange="setCandidateVisibility(this.checked, document.getElementById('showAllCandidates').checked)"><span class="lc-dot" style="background:#16a34a"></span>상위후보</label>
        <label title="전체 후보 레이어 표시"><input id="showAllCandidates" type="checkbox" autocomplete="off" onchange="setCandidateVisibility(document.getElementById('showTopCandidates').checked, this.checked)"><span class="lc-dot" style="background:#64748b"></span>전체후보</label>
      </div>
    </div>
    <div class="filter-row">
      <select id="shaftFilter" onchange="renderList()"><option value="">전체 수직구</option></select>
      <select id="gateFilter" onchange="renderList()"><option value="">전체 Gate</option><option>Pass</option><option>Fail</option></select>
      <input id="minArea" type="number" value="500" min="0" oninput="renderAll();setTimeout(fitFilteredCandidateBounds,240)" title="최소면적㎡">
      <input id="minScore" type="number" placeholder="최소점수" min="0" max="100" oninput="onScoreFilterChange()" title="최소 100점 환산점수">
    </div>
    <div class="area-panel" id="areaSummary"></div>
    <div class="candidate-list" id="candidateList"></div>
  </aside>
  <main class="main">
    <div class="kpi-grid" id="kpis"></div>
    <div class="tabs">
      <button class="tab active" onclick="openTab('detail')">후보지 상세</button>
      <button class="tab" onclick="openTab('score')">병렬검토·점수화</button>
      <button class="tab" onclick="openTab('map')">위치도</button>
      <button class="tab" onclick="openTab('checklist')">현장 체크리스트</button>
      <button class="tab" onclick="openTab('criteria')">점수기준</button>
      <button class="tab" onclick="openTab('table')">전체표</button>
    </div>
    <section id="detail" class="tab-panel active"></section>
    <section id="score" class="tab-panel"></section>
    <section id="map" class="tab-panel"></section>
    <section id="checklist" class="tab-panel"></section>
    <section id="criteria" class="tab-panel"></section>
    <section id="table" class="tab-panel"></section>
  </main>
</div>

// ── 주소창(URL) 필터 연동 ─────────────────────────────
// 예시:
//   ?score=80              → 80점 이상만 표시
//   ?score=80&area=길동    → 길동 + 80점 이상
//   ?score=80&gate=Pass    → Gate Pass + 80점 이상
//   ?q=용산&score=70       → 검색어 + 70점 이상
let URL_SYNC_READY = false;
let URL_SYNC_TIMER = null;
let URL_INITIAL_ID = null;

function urlParams(){ return new URLSearchParams(window.location.search); }
function paramFirst(p, names){
  for(const nm of names){
    const v=p.get(nm);
    if(v!==null && v!==undefined) return v;
  }
  return null;
}
function paramBool(v){
  if(v===null || v===undefined) return false;
  return ['1','true','y','yes','on','상위','pass'].includes(String(v).toLowerCase());
}
function applyFiltersFromURL(){
  const p=urlParams();
  const area=paramFirst(p,['area','구역']);
  const q=paramFirst(p,['q','search','검색']);
  const shaft=paramFirst(p,['shaft','수직구']);
  const gate=paramFirst(p,['gate','Gate']);
  const minAreaParam=paramFirst(p,['minArea','areaMin','면적']);
  const score=paramFirst(p,['score','minScore','점수','s']);
  const top=paramFirst(p,['top','상위']);
  const pass=paramFirst(p,['pass','Pass']);
  const view=paramFirst(p,['view','candidateView','후보표시']);
  const id=paramFirst(p,['id','candidate','후보']);

  if(area && ['전체','한강로','길동'].includes(area)) areaFilter=area;
  if(q!==null && document.getElementById('search')) search.value=q;
  if(shaft!==null && document.getElementById('shaftFilter')) shaftFilter.value=shaft;
  if(gate!==null && document.getElementById('gateFilter')) gateFilter.value=gate;
  if(minAreaParam!==null && document.getElementById('minArea')) minArea.value=minAreaParam;
  if(score!==null && document.getElementById('minScore')) minScore.value=score;
  // 기본은 상위후보만 표시. URL에서 view=all/top/none 으로 제어 가능
  showTopCandidates = true;
  showAllCandidates = false;
  onlyTop = true;
  if(view!==null){
    const vv=String(view).toLowerCase();
    if(['all','전체','전체후보'].includes(vv)){ showTopCandidates=true; showAllCandidates=true; onlyTop=false; }
    else if(['none','off','0','끄기'].includes(vv)){ showTopCandidates=false; showAllCandidates=false; onlyTop=false; }
    else { showTopCandidates=true; showAllCandidates=false; onlyTop=true; }
  }else if(top!==null){
    const tv=paramBool(top);
    showTopCandidates=tv;
    showAllCandidates=!tv;
    onlyTop=tv;
  }
  if(pass!==null) onlyPass=paramBool(pass);
  if(id!==null) URL_INITIAL_ID=id;
}
function updateURLFromFilters(){
  if(!URL_SYNC_READY) return;
  clearTimeout(URL_SYNC_TIMER);
  URL_SYNC_TIMER=setTimeout(()=>{
    const p=new URLSearchParams();
    const q=(document.getElementById('search')?.value||'').trim();
    const sh=document.getElementById('shaftFilter')?.value||'';
    const gate=document.getElementById('gateFilter')?.value||'';
    const minA=document.getElementById('minArea')?.value||'';
    const minS=document.getElementById('minScore')?.value||'';

    if(areaFilter && areaFilter!=='전체') p.set('area', areaFilter);
    if(q) p.set('q', q);
    if(sh) p.set('shaft', sh);
    if(gate) p.set('gate', gate);
    if(minA && minA!=='500') p.set('minArea', minA);
    if(minS!=='') p.set('score', minS);   // 점수 입력값은 주소창 ?score= 로 저장
    if(showAllCandidates) p.set('view','all');
    else if(showTopCandidates) p.set('view','top');
    else p.set('view','none');
    if(onlyPass) p.set('pass','1');
    if(selectedId) p.set('id', selectedId);

    const qs=p.toString();
    const next=window.location.pathname + (qs ? '?' + qs : '') + window.location.hash;
    window.history.replaceState(null, '', next);
  }, 200);
}

function n(v){const x=Number(String(v??'').replace(/,/g,''));return Number.isFinite(x)?x:0;}

function safe(v){return (v===null||v===undefined||String(v).toUpperCase()==='NULL'||String(v)==='')?'-':String(v);}
function score100(r){return n(r.TOTAL100_RAW ?? r.TOTAL100 ?? (n(r.INST_SCORE)+n(r.HYD_SCORE)));}
function score100Text(r){return score100(r).toFixed(1);}
function areaKey(r){return r.AREA_KEY || String(r.ID).split('-')[0];}
function areaKr(r){return r.AREA_KR || (areaKey(r)==='hangangro'?'한강로':'길동');}

const CHECKLIST_STORAGE_PREFIX = 'vertical_shaft_field_checklist_v3_';
function htmlEscape(v){return String(v??'').replace(/[&<>'"]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));}
function checklistKey(id){return CHECKLIST_STORAGE_PREFIX + id;}
function getChecklistData(id){
  if(!id) return {items:{},updatedAt:''};
  try{ return JSON.parse(localStorage.getItem(checklistKey(id))||'{"items":{}}') || {items:{}}; }
  catch(e){ return {items:{}}; }
}
function saveChecklistData(id,data){
  if(!id) return;
  data.updatedAt = new Date().toISOString();
  localStorage.setItem(checklistKey(id), JSON.stringify(data));
}
function setCheckValue(itemId, field, value){
  if(!selectedId) return;
  const d=getChecklistData(selectedId);
  if(!d.items) d.items={};
  if(!d.items[itemId]) d.items[itemId]={};
  d.items[itemId][field]=value;
  saveChecklistData(selectedId,d);
  updateChecklistSummary();
}
function checklistStats(id){
  const d=getChecklistData(id), vals=[];
  FIELD_CHECK_SECTIONS.forEach(sec=>sec.items.forEach(it=>{ vals.push((d.items&&d.items[it[0]]&&d.items[it[0]].judge)||''); }));
  return {total:vals.length, o:vals.filter(x=>x==='O').length, tri:vals.filter(x=>x==='△').length, x:vals.filter(x=>x==='X').length, blank:vals.filter(x=>!x).length, updatedAt:d.updatedAt||''};
}
function checklistSummaryHtml(r){
  const st=checklistStats(r.ID);
  return `<div class="checklist-summary">
    <div class="check-mini">전체 항목<b>${st.total}</b></div>
    <div class="check-mini">O 양호<b>${st.o}</b></div>
    <div class="check-mini">△ 조건부<b>${st.tri}</b></div>
    <div class="check-mini">X 곤란<b>${st.x}</b></div>
    <div class="check-mini">미작성<b>${st.blank}</b></div>
  </div><div class="footer-note">마지막 저장: ${st.updatedAt ? new Date(st.updatedAt).toLocaleString('ko-KR') : '아직 저장 없음'} · 입력값은 현재 브라우저 localStorage에 자동 저장됩니다.</div>`;

  const sections = FIELD_CHECK_SECTIONS.map(sec=>{

      const judge=cur.judge||'';

      const opt=v=>`<option value="${v}" ${judge===v?'selected':''}>${v||'선택'}</option>`;

    <div class="detail-head" style="margin-top:12px"><div><h2>${htmlEscape(r.CAND_NM)}</h2><div class="sub">${areaKr(r)} · ${htmlEscape(r.MAIN_SHAFT||r.SHAFT||'')} · PNU ${htmlEscape(r.PNU||'')}</div></div><div><span class="badge ${badgeClass(r)}">${score100Text(r)}점</span> <span class="badge blue">Gate ${htmlEscape(r.GATE||'')}</span></div></div>

function csvCell(v){return '"'+String(v??'').replaceAll('"','""').replace(/\r?\n/g,' ').trim()+'"';}
function checklistCandidateRows(r){
  const d=getChecklistData(r.ID);
  const rows=[];
  FIELD_CHECK_SECTIONS.forEach(sec=>sec.items.forEach(it=>{
    const cur=(d.items&&d.items[it[0]])||{};
    rows.push([
      r.ID, areaKr(r), r.MAIN_SHAFT||r.SHAFT||'', r.CAND_NM||'', r.PNU||'', r.JIBUN||'', score100Text(r), r.GATE||'',
      sec.title, it[1], it[2], cur.judge||'', cur.memo||'', d.updatedAt||''
    ]);

function exportChecklistCSV(scope){
  let cand=[];
  if(scope==='current') cand = selectedId && DATA[selectedId] ? [DATA[selectedId]] : [];
  else if(scope==='all') cand = records.slice();
  else cand = getFiltered();
  if(!cand.length){ alert('내보낼 후보지가 없습니다.'); return; }
  const cols=['후보ID','구역','수직구','후보지','PNU','지번','100점환산','Gate','체크구분','확인항목','현장에서확인할내용','판정','메모','저장시각'];
  const body=cand.flatMap(checklistCandidateRows);
  const csv=[cols].concat(body).map(row=>row.map(csvCell).join(',')).join('\n');
  const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  const stamp=new Date().toISOString().slice(0,19).replace(/[-:T]/g,'');
  const name = scope==='current' ? `현장체크리스트_${(DATA[selectedId]?.CAND_NM||'선택후보').replace(/[\\/:*?"<>|]+/g,'_')}_${stamp}.csv` : `현장체크리스트_${scope}_${stamp}.csv`;
  a.download=name;
  a.click();
}

// ── 라이브 카카오맵 ───────────────────────────────────
const JUDGE_POLY_STYLE = {
  good: { strokeColor:'#047857', fillColor:'#34d399', fillOpacity:0.26 },
  mid:  { strokeColor:'#2563eb', fillColor:'#60a5fa', fillOpacity:0.22 },
  warn: { strokeColor:'#6b7280', fillColor:'#9ca3af', fillOpacity:0.18 },
  bad:  { strokeColor:'#dc2626', fillColor:'#f87171', fillOpacity:0.20 }
};
const KM_MARK_COLOR = { good:'#047857', mid:'#2563eb', warn:'#6b7280', bad:'#dc2626' };
let KMAP = null;            // 단일 카카오맵
let KAKAO_READY = false;    // SDK 로드 완료
let CUR_MAP_AREA = null;    // 현재 그려진 구역 key
let KOVERLAYS = {};         // candId -> {polys, marker, el, pos}
let KSHAPES = [];           // 현재 구역 버퍼/수직구 오버레이(구역 전환 시 제거)
let KSKELETON = false;      // 위치도 탭 골격 1회 생성 플래그

// 보안 경량화: 지장물/추가 레이어 ON·OFF 기능은 제거함.
// HTML에는 지장물 좌표 데이터와 오버레이 UI가 포함되지 않는다.
function renderExtraLayerControl(){ return; }
function drawExtraKakaoLayers(){ return; }

function _ll(a){ return new kakao.maps.LatLng(a[1], a[0]); }
function _ring(r){ return r.map(_ll); }
function drawPolys(parts, style, onClick){
  const out=[];
  (parts||[]).forEach(part=>{
    const path=part.map(_ring);
    const pg=new kakao.maps.Polygon(Object.assign({map:KMAP,path:path.length===1?path[0]:path,strokeWeight:2,strokeOpacity:0.95},style));
    if(onClick) kakao.maps.event.addListener(pg,'click',onClick);
    out.push(pg);
  });
  return out;
}
function drawLines(parts, style){
  const out=[];
  (parts||[]).forEach(part=>{
    out.push(new kakao.maps.Polyline(Object.assign({
      map:KMAP,
      path:part.map(_ll),
      strokeWeight:5,
      strokeOpacity:1.0,
      zIndex:25
    },style||{})));
  });
  return out;
}

function clearAreaOverlays(){
  KSHAPES.forEach(o=>{ try{o.setMap(null);}catch(e){} });
  KSHAPES=[];
  Object.values(KOVERLAYS).forEach(o=>{
    if(o.polys) o.polys.forEach(p=>{ try{p.setMap(null);}catch(e){} });
    if(o.marker){ try{o.marker.setMap(null);}catch(e){} }
  });
  KOVERLAYS={};
}
function drawAreaOverlays(ak){
  if(!KMAP) return;
  clearAreaOverlays();
  const a=KAKAO_AREAS[ak]||{};
  // 200m 버퍼
  const hasBuf=a.buffers&&a.buffers.length;
  if(hasBuf){ a.buffers.forEach(b=>{ drawPolys(b.parts,{strokeColor:'#2563eb',strokeStyle:'dash',strokeWeight:2,fillColor:'#60a5fa',fillOpacity:0.10}).forEach(p=>KSHAPES.push(p)); }); }
  // 수직구 마커(+버퍼없으면 원)
  (a.shafts||[]).forEach(s=>{
    if(!s.ll) return;
    const pos=_ll(s.ll), el=document.createElement('div');
    el.className='km-shaft'; el.textContent='⬇ '+(s.label||'수직구');
    KSHAPES.push(new kakao.maps.CustomOverlay({position:pos,content:el,yAnchor:1,xAnchor:0.5,zIndex:8,map:KMAP}));
    if(!hasBuf){ KSHAPES.push(new kakao.maps.Circle({center:pos,radius:s.bufferM||200,strokeWeight:2,strokeColor:'#2563eb',strokeOpacity:0.7,strokeStyle:'dash',fillColor:'#60a5fa',fillOpacity:0.10,map:KMAP})); }
  });
  // 후보 필지(판정색) + 점수 마커
  // 핵심: 현재 검색/면적/점수/Gate/수직구 필터를 통과한 후보만 지도에 표시한다.
  const bounds=new kakao.maps.LatLngBounds(); let any=false;
  const mapRecords=getFiltered().filter(r=>(r.AREA_KEY||String(r.ID).split('-')[0])===ak);
  mapRecords.forEach(r=>{
    const cls=badgeClass(r);
    if(r.POLY&&r.POLY.parts){
      const st=JUDGE_POLY_STYLE[cls]||JUDGE_POLY_STYLE.warn;
      let shapes=[];
      if(r.POLY.kind==='polygon'){
        shapes=drawPolys(r.POLY.parts,st,(function(id){return function(){selectCandidate(id,false);};})(r.ID));
        r.POLY.parts.forEach(poly=>poly.forEach(ring=>ring.forEach(pt=>{bounds.extend(_ll(pt));any=true;})));
      }else if(r.POLY.kind==='line'){
        shapes=drawLines(r.POLY.parts,{strokeColor:st.strokeColor||'#2563eb',strokeWeight:3,strokeOpacity:0.85,zIndex:12});
        r.POLY.parts.forEach(line=>line.forEach(pt=>{bounds.extend(_ll(pt));any=true;}));
      }
      const slot=KOVERLAYS[r.ID]=KOVERLAYS[r.ID]||{};
      slot.polys=shapes;
    }
    if(r.LL&&r.LL.length===2){
      const pos=_ll(r.LL), el=document.createElement('div');
      el.className='km-marker'; el.style.background=KM_MARK_COLOR[cls]||'#6b7280';
      el.textContent=(r.MAP_NO?'#'+r.MAP_NO+' ':'')+score100Text(r)+'점';
      el.title=safe(r.CAND_NM)+' · '+jLabel(r);
      el.onclick=function(e){e.stopPropagation();selectCandidate(r.ID,false);};
      const ov=new kakao.maps.CustomOverlay({position:pos,content:el,yAnchor:0.5,xAnchor:0.5,zIndex:5,map:KMAP});
      const slot=KOVERLAYS[r.ID]=KOVERLAYS[r.ID]||{}; slot.marker=ov; slot.el=el; slot.pos=pos;
      bounds.extend(pos); any=true;
    }
  });
  (a.shafts||[]).forEach(s=>{ if(s.ll){bounds.extend(_ll(s.ll));any=true;} });
  if(any) KMAP.setBounds(bounds);
  setTimeout(()=>{ try{ KMAP.relayout(); if(any) KMAP.setBounds(bounds); }catch(e){} }, 120);
  CUR_MAP_AREA=ak;
}
function refreshKakaoMapForFilters(){
  // 필터 입력값이 바뀌면 목록뿐 아니라 지도 위 후보지/점수마커도 같이 갱신한다.
  // 지장물은 기존 ON/OFF 상태를 유지하고, 후보지만 현재 필터 결과로 줄인다.
  if(!KMAP) return;
  const fs=getFiltered();
  let targetArea=CUR_MAP_AREA;

  if(areaFilter==='한강로') targetArea='hangangro';
  else if(areaFilter==='길동') targetArea='gildong';
  else if(selectedId && DATA[selectedId] && fs.some(r=>r.ID===selectedId)) targetArea=areaKey(DATA[selectedId]);
  else if(fs.length) targetArea=areaKey(fs[0]);
  else if(selectedId && DATA[selectedId]) targetArea=areaKey(DATA[selectedId]);

  if(!targetArea) return;
  drawAreaOverlays(targetArea);
  if(selectedId && fs.some(r=>r.ID===selectedId)) highlightKakao(selectedId);
}


function recordLatLngs(r){
  const pts=[];
  if(r && r.POLY && r.POLY.parts){
    if(r.POLY.kind==='polygon'){
      (r.POLY.parts||[]).forEach(poly=>(poly||[]).forEach(ring=>(ring||[]).forEach(pt=>{ if(pt&&pt.length===2) pts.push(pt); })));
    }else if(r.POLY.kind==='line'){
      (r.POLY.parts||[]).forEach(line=>(line||[]).forEach(pt=>{ if(pt&&pt.length===2) pts.push(pt); }));
    }
  }
  if(!pts.length && r && r.LL && r.LL.length===2) pts.push(r.LL);
  return pts;
}
function fitRecordListBounds(list){
  if(!KMAP || !list || !list.length) return false;
  const bounds=new kakao.maps.LatLngBounds();
  let any=false;
  list.forEach(r=>recordLatLngs(r).forEach(pt=>{bounds.extend(_ll(pt)); any=true;}));
  if(any){
    try{KMAP.relayout();KMAP.setBounds(bounds);}catch(e){}
    return true;
  }
  return false;
}
function fitCandidateBoundary(id){
  const r=DATA[id||selectedId];
  if(!r || !ensureKakaoMap()) return;
  const ak=areaKey(r);
  if(CUR_MAP_AREA!==ak) drawAreaOverlays(ak);
  setTimeout(()=>{fitRecordListBounds([r]); highlightKakao(r.ID);},120);
}
function fitFilteredCandidateBounds(){
  if(!ensureKakaoMap()) return;
  let ak=null;
  if(areaFilter==='한강로') ak='hangangro';
  else if(areaFilter==='길동') ak='gildong';
  else if(selectedId && DATA[selectedId]) ak=areaKey(DATA[selectedId]);
  else if(CUR_MAP_AREA) ak=CUR_MAP_AREA;
  else { const fs0=getFiltered(); if(fs0.length) ak=areaKey(fs0[0]); }
  if(!ak) return;
  if(CUR_MAP_AREA!==ak) drawAreaOverlays(ak);
  const fs=getFiltered().filter(r=>areaKey(r)===ak);
  setTimeout(()=>{ if(!fitRecordListBounds(fs) && selectedId) fitCandidateBoundary(selectedId); },160);
}
function onScoreFilterChange(){
  // 최소점수 필터를 바꾸면 필터 후 선택된 후보지 1개 부지경계로 바로 확대한다.
  // 기존처럼 필터 결과 전체 extent로 가는 것이 아니라, 선택 후보지 중심으로 들어간다.
  renderAll();
  setTimeout(()=>{
    if(selectedId) fitCandidateBoundary(selectedId);
    else fitFilteredCandidateBounds();
  },320);
}

function highlightKakao(id){
  Object.values(KOVERLAYS).forEach(o=>{
    if(o.el) o.el.classList.remove('active');
    if(o.polys) o.polys.forEach(p=>{ try{p.setOptions({strokeWeight:2});}catch(e){} });
  });
  const o=KOVERLAYS[id]; if(!o) return;
  if(o.el) o.el.classList.add('active');
  if(o.polys) o.polys.forEach(p=>{ try{p.setOptions({strokeWeight:5,strokeColor:'#111827'});}catch(e){} });
  if(o.pos&&KMAP) KMAP.panTo(o.pos);
}
function ensureKakaoMap(){
  if(KMAP) return KMAP;
  if(!(USE_KAKAO&&KAKAO_READY&&window.kakao&&window.kakao.maps)) return null;
  const cont=document.getElementById('kakao-live'); if(!cont) return null;
  KMAP=new kakao.maps.Map(cont,{center:new kakao.maps.LatLng(37.5665,126.9780),level:KAKAO_LEVEL});
  KMAP.addControl(new kakao.maps.MapTypeControl(),kakao.maps.ControlPosition.TOPRIGHT);
  KMAP.addControl(new kakao.maps.ZoomControl(),kakao.maps.ControlPosition.RIGHT);

function getFiltered(){
 const q=document.getElementById('search')?.value.trim().toLowerCase()||'';
 const sh=document.getElementById('shaftFilter')?.value||'';
 const gate=document.getElementById('gateFilter')?.value||'';
 const minA=n(document.getElementById('minArea')?.value||500);
 const minS=document.getElementById('minScore')?.value===''?-1:n(document.getElementById('minScore')?.value);
 return records.filter(r=>{
  if(areaFilter!=='전체'&&areaKr(r)!==areaFilter)return false;
  if(!showTopCandidates && !showAllCandidates) return false;
  if(!showAllCandidates && showTopCandidates && !r.IS_TOP) return false;
  if(onlyPass&&r.GATE!=='Pass')return false;
  if(sh){
    const shaftTokens=[safe(r.MAIN_SHAFT||r.SHAFT)].concat(safe(r.AFFECT_SHAFTS).split(',').map(x=>x.trim())).filter(x=>x&&x!='-');
    if(!shaftTokens.includes(sh)) return false;
  }
  if(gate&&r.GATE!==gate)return false;
  if(n(r.AREA_M2_RAW??r.AREA_M2)<minA)return false;
  if(minS>=0&&score100(r)<minS)return false;
  if(q){
   const hay=[r.CAND_NM,r.PNU,r.JIBUN,r.AREA_KR,r.MAIN_SHAFT,r.AFFECT_SHAFTS,r.JIMOK,r.OWN_CLASS,r.BLD_CLASS,r.JUDGE,r.FAIL,r.OPINION].map(safe).join(' ').toLowerCase();
   if(!hay.includes(q))return false;
  }
  return true;
 }).sort((a,b)=>score100(b)-score100(a));
}

function setTopOnly(){setCandidateVisibility(true,false);}
function setPassOnly(){onlyPass=!onlyPass;renderAll();}
function resetFilters(){areaFilter='전체';onlyTop=true;onlyPass=false;showTopCandidates=true;showAllCandidates=false;selectedId=null;URL_INITIAL_ID=null;search.value='';shaftFilter.value='';gateFilter.value='';minArea.value='500';minScore.value='';syncCandidateVisibilityUI();renderAll();}

function gateCard(title,state,desc){const cls=state==='통과'?'pass':(state==='조건부'?'cond':'fail');return`<div class="gate ${cls}"><div class="gate-title">${title}</div><div class="gate-state">${state}</div><p>${desc}</p></div>`;}
function parallelGates(r){
 const area=n(r.AREA_M2_RAW), rail=n(r.RAIL_D_RAW), util=n(r.UTIL_RISK_RAW), floor=n(r.MAX_FLR_RAW);
 return [
 gateCard('면적',area>=500?'통과':'위험',`${fmt(area,1)}㎡ / 기준 500㎡ 이상`),
 gateCard('소유·부지확보',n(r.P_OWNER)>0?'통과':'위험',`${safe(r.L_OWNER)} · ${safe(r.OWN_CLASS)} / ${safe(r.P_OWNER)}점`),
 gateCard('시공성·작업장',n(r.P_WORK)>=4?'통과':(n(r.P_WORK)>=2?'조건부':'위험'),`${safe(r.L_WORK)} / 도로폭 ${safe(r.ROAD_W)}m / ${safe(r.P_WORK)}점`),
 gateCard('보상·권리관계',n(r.P_COMP)>=3?'통과':(n(r.P_COMP)>=2?'조건부':'위험'),`${safe(r.L_COMP)} / ${safe(r.P_COMP)}점`),
 gateCard('운영·관리시설',n(r.P_MGMT)>=2?'통과':(n(r.P_MGMT)>=1?'조건부':'위험'),`${safe(r.L_MGMT)} / ${safe(r.P_MGMT)}점`),
 gateCard('지장물',n(r.P_BIGUTIL)>0&&n(r.P_UTIL)>0?'통과':(util>0?'조건부':'통과'),`대형: ${replaceUtil(r.L_BIGUTIL)} / 일반: ${replaceUtil(r.L_UTIL)} / 위험도 ${safe(r.UTIL_RISK)}`),
 gateCard('철도·GTX',rail>30?'통과':(rail>=10?'조건부':'위험'),`${safe(r.L_RAIL)} / 이격 ${safe(r.RAIL_D)}m / ${safe(r.P_RAIL)}점`),
 gateCard('건축물',floor<5?'통과':'위험',`${safe(r.BLD_CLASS)} / ${safe(r.BLD_CNT)}동 / 최고 ${safe(r.MAX_FLR)}층`)
 ].join('');
}

function tag(label, cls='gray'){return {label, cls};}
function candidateTags(r){
  const tags=[];
  tags.push(tag(r.IS_TOP?'상위후보':'전체후보', r.IS_TOP?'good':'gray'));
  tags.push(tag(`Gate ${safe(r.GATE)}`, r.GATE==='Pass'?'good':'bad'));
  const s=score100(r);
  if(s>=80) tags.push(tag('80점 이상', 'good')); else if(s>=65) tags.push(tag('조건부 점수', 'warn')); else tags.push(tag('낮은 우선순위', 'bad'));
  if(r.TOP_EXCL==='Y') tags.push(tag('상위제외', 'bad'));
  if(safe(r.OWN_CLASS).includes('공공')) tags.push(tag('공공부지','good'));
  else if(safe(r.OWN_CLASS).includes('사유')) tags.push(tag('사유지','warn'));
  else tags.push(tag('소유확인필요','warn'));
  if(n(r.MAX_FLR_RAW)>=5) tags.push(tag('5층이상','bad'));
  if(safe(r.IS_CC)==='Y') tags.push(tag(safe(r.CC_REASON)||'집합/상업시설','bad'));
  if(n(r.RAIL_D_RAW)<=10) tags.push(tag('철도직접영향','bad')); else if(n(r.RAIL_D_RAW)<=30) tags.push(tag('철도30m이내','warn'));
  if(n(r.UTIL_RISK_RAW)>=9) tags.push(tag('지장물고위험','bad')); else if(n(r.UTIL_RISK_RAW)>=4) tags.push(tag('지장물주의','warn'));
  if(n(r.P_WORK)<=2) tags.push(tag('작업장협소','bad')); else if(n(r.P_WORK)<=4) tags.push(tag('작업장조건부','warn'));
  if(n(r.P_MGMT)<=1) tags.push(tag('관리시설협소','warn'));
  if(safe(r.L_SHAPE)&&safe(r.L_SHAPE)!=='-') tags.push(tag(safe(r.L_SHAPE), r.TOP_EXCL==='Y'?'bad':'warn'));
  if(n(r.DIST_SHAFT_RAW)>150) tags.push(tag('수리이격주의','warn')); else if(n(r.DIST_SHAFT_RAW)<=50) tags.push(tag('수리위치양호','good'));
  return tags;
}
function tagsHtml(r){
  return `<div class="tag-wrap">${candidateTags(r).slice(0,14).map(t=>`<span class="tag ${t.cls}">${htmlEscape(t.label)}</span>`).join('')}</div>`;
}
function candidateReasonRows(r){
  const rows=[];
  const add=(k,v,why)=>{ if(v && safe(v)!=='-') rows.push([k, replaceUtil(v), why||'']); };
  if(r.GATE==='Fail') add('Gate 배제', r.FAIL || '자동 Gate 조건', '상위 후보 검토 전에 해소 필요');
  if(r.TOP_EXCL==='Y') add('상위 제외', r.TOP_EXCL_R || '부지 형상/활용성 조건', '전체에는 남기되 상위 후보에서는 제외');
  if(score100(r)<65) add('점수 낮음', `${score100Text(r)}점`, '수리성 또는 설치성 항목의 약점이 큼');
  if(n(r.P_OWNER)<4) add('소유·확보', `${safe(r.L_OWNER)} / ${safe(r.P_OWNER)}점`, '공공성 또는 확보 가능성 확인 필요');
  if(n(r.P_WORK)<4) add('작업장 확보', `${safe(r.L_WORK)} / ${safe(r.P_WORK)}점`, '장비 배치·버력 반출·자재 적치 현장확인 필요');
  if(n(r.P_COMP)<3) add('보상 난이도', `${safe(r.L_COMP)} / ${safe(r.P_COMP)}점`, '소유자·임차인·영업권 협의 리스크 확인 필요');
  if(n(r.P_MGMT)<2) add('관리시설 배치', `${safe(r.L_MGMT)} / ${safe(r.P_MGMT)}점`, '환기·탈취·전력·계측 설비 배치성 확인 필요');
  if(n(r.P_BIGUTIL)<4 || n(r.P_UTIL)<3 || n(r.UTIL_RISK_RAW)>=4) add('지장물', `${replaceUtil(r.L_BIGUTIL)} / ${replaceUtil(r.L_UTIL)} · 위험도 ${safe(r.UTIL_RISK)}`, '도면과 현장 불일치, 이설 가능성 확인 필요');
  if(n(r.RAIL_D_RAW)<=30 || n(r.P_RAIL)<5) add('철도·지하철', `${safe(r.L_RAIL)} · ${safe(r.RAIL_D)}m`, '관계기관 협의 또는 안전성 검토 필요');
  if(n(r.MAX_FLR_RAW)>=5 || safe(r.IS_CC)==='Y') add('건축물', `${safe(r.BLD_CLASS)} / ${safe(r.CC_REASON)}`, '5층 이상·집합건물·대형상가 여부 확인 필요');
  if(safe(r.L_SHAPE)&&safe(r.L_SHAPE)!=='-') add('부지 형상', `${safe(r.L_SHAPE)} · 단변 ${safe(r.SHORT_W)}m · 장단변비 ${safe(r.ASPECT)}`, '면적은 충분해도 실제 작업장 활용성이 낮을 수 있음');
  if(n(r.DIST_SHAFT_RAW)>100) add('수리 이격', `${safe(r.HYD_LABEL)} · ${safe(r.DIST_SHAFT)}m`, '동일 수리권역 및 침수저감효과 재확인 필요');
  if(!rows.length) rows.push(['주요 제한사항','현재 자동평가 기준상 큰 제한사항은 적음','현장 체크리스트로 최종 확인']);
  return rows;
}
function candidateReasonsHtml(r){

function selectCandidate(id,scrollToTop,zoomToBoundary){
  const r=DATA[id];
  if(!r)return;
  selectedId=id;
  renderList();
  renderDetail(r);
  renderScore(r);
  renderMap(r);
  renderCriteria();
  renderChecklist(r);
  renderTable();
  if(scrollToTop)document.querySelector('.main').scrollIntoView({behavior:'smooth',block:'start'});

  // 핵심 수정: 후보지 카드/표/마커를 누르면 위치도 탭으로 이동하고 해당 부지경계로 자동 확대한다.
  // 초기 로딩처럼 원치 않는 경우만 세 번째 인자 false로 막는다.
  if(zoomToBoundary!==false){
    openTab('map');
    setTimeout(()=>fitCandidateBoundary(id),360);
  }
}
function openTab(id){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  [...document.querySelectorAll('.tab')].find(t=>t.getAttribute('onclick')?.includes(`'${id}'`))?.classList.add('active');
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if(id==='map'&&selectedId){
    renderMap(DATA[selectedId]);
    setTimeout(()=>{
      if(KMAP){
        try{KMAP.relayout();}catch(e){}
        fitCandidateBoundary(selectedId);
      }
    },160);
  }
  if(id==='checklist'&&selectedId)renderChecklist(DATA[selectedId]);
  if(id==='table')renderTable();
}
function renderAll(){

  if(selectedId && !fs.some(r=>r.ID===selectedId)) selectedId = fs[0]?.ID || null;
  if(!selectedId && fs.length) selectedId = fs[0].ID;
  renderList();
  if(selectedId){renderDetail(DATA[selectedId]);renderScore(DATA[selectedId]);renderMap(DATA[selectedId]);renderChecklist(DATA[selectedId]);renderTable();}
}

function initFilters(){

 });
 const shafts=[...new Set(bag.filter(x=>x&&x!='-'))].sort((a,b)=>a.localeCompare(b,'ko'));

  URL_SYNC_READY=true;
  renderList();
  const filtered=getFiltered();
  let first=null;
  if(URL_INITIAL_ID && DATA[URL_INITIAL_ID] && filtered.some(r=>r.ID===URL_INITIAL_ID)) first=DATA[URL_INITIAL_ID];
  if(!first) first=filtered[0]||records[0];
  if(first) selectCandidate(first.ID,false,false);
  renderCriteria();
}
init();
// 카카오 SDK 로드 후 위치도 갱신
if(USE_KAKAO && KAKAO_KEY_SET && window.kakao && window.kakao.maps){
  kakao.maps.load(function(){ KAKAO_READY=true; if(selectedId) renderMap(DATA[selectedId]); });
}
</script>
</body>
